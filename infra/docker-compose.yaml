# Состав сервера.
#
# Имена образов подставляются при сборке конфигурации из переменных:
# держать их здесь строкой значит править файл при каждой выкатке.
#
# Секреты живут в /etc/fhr.env, он кладётся на машину отдельно
# и доступен только root.

# Логи всех контейнеров: тот же ротационный предел, что в daemon.json, плюс
# имя службы compose в каждой строке (поле attrs) — по нему в Cloud Logging
# видно, чей это лог (агент `ua` ниже читает файлы Docker, а в них только id).
x-logging: &logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"
    labels: "com.docker.compose.service"

services:
  # Миграции накатываются до старта приложения и завершаются.
  #
  # Отдельным шагом, а не внутри приложения: два экземпляра
  # приложения, стартующие одновременно, попытались бы мигрировать
  # базу вдвоём. Здесь же шаг один и выполняется до всего остального.
  #
  # environment здесь обязателен, как у app и worker: DATABASE_URL базы
  # CRM приходит в var.runtime_env и перекрывает строку из /etc/fhr.env,
  # которая указывает на прежнюю базу hr_platform (архив нашей версии CRM
  # до 30.09.2026). Без этой строки миграции новой CRM ушли бы в архив.
  migrate:
    image: TOOLS_IMAGE_PLACEHOLDER
    restart: "no"
    logging: *logging
    # Потолки ресурсов (машина 2 ядра / 4 ГБ, см. комментарий у app).
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    env_file: /etc/fhr.env
    environment: RUNTIME_ENV_PLACEHOLDER
    command: ["npx", "prisma", "migrate", "deploy"]

  # Первый владелец на пустой базе: организация и приглашение для
  # profattakhov@gmail.com, письмо со ссылкой — один раз (факт отправки
  # записан в базе, повторные запуски ничего не повторяют; см.
  # scripts/bootstrap-owner.ts в репозитории CRM). Входа по SSH на
  # сервер нет, поэтому это служба, а не ручная команда.
  owner-bootstrap:
    image: TOOLS_IMAGE_PLACEHOLDER
    restart: "no"
    logging: *logging
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    env_file: /etc/fhr.env
    environment: RUNTIME_ENV_PLACEHOLDER
    command: ["npx", "tsx", "scripts/bootstrap-owner.ts", "ensure"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  caddy:
    image: caddy:2-alpine
    restart: always
    logging: *logging
    # Прокси: 80/443 привязываются только с NET_BIND_SERVICE, остальные
    # возможности не нужны. Сертификаты пишутся в том caddy_data (владелец root).
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    ports:
      - "80:80"
      - "443:443"
    # Конфигурация приходит переменной CADDYFILE (Caddyfile + maintenance.caddy,
    # см. maintenance.tf), а не файлом из cloud-init: тот читается один раз, при
    # первой загрузке, и правка Caddyfile или режима работ потребовала бы
    # пересоздать машину. Контейнер кладёт текст в /tmp и запускает Caddy так же,
    # как образ по умолчанию (caddy run --adapter caddyfile).
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        printf '%s' "$$CADDYFILE" > /tmp/Caddyfile
        exec caddy run --config /tmp/Caddyfile --adapter caddyfile
    environment:
      CADDYFILE: CADDYFILE_PLACEHOLDER
      # Плановые работы (maintenance_mode, maintenance_bypass в prod.tfvars)
      MAINTENANCE_MODE: MAINTENANCE_MODE_PLACEHOLDER
      MAINTENANCE_BYPASS: MAINTENANCE_BYPASS_PLACEHOLDER
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

  app:
    image: APP_IMAGE_PLACEHOLDER
    restart: always
    logging: *logging
    # Потолки ресурсов: машина 2 ядра / 4 ГБ, из них система и Docker
    # забирают ~0,5 ГБ. Сумма потолков работающих служб (app 1280 + worker 512
    # + caddy 128 + ua 256 = 2176 МБ) оставляет запас; migrate и owner-bootstrap
    # живут только при старте. Значения подобраны с запасом, чтобы не убить
    # службу при всплеске: перед снижением посмотрите память в Monitoring.
    # Node в контейнере сам берёт размер кучи из потолка памяти.
    mem_limit: 1280m
    cpus: 1.5
    pids_limit: 512
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    env_file: /etc/fhr.env
    # Переменные, которые меняются обычным apply (var.runtime_env)
    environment: RUNTIME_ENV_PLACEHOLDER
    expose:
      - "3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  # Фоновые задачи: напоминания, контроль сроков, сводки.
  worker:
    image: TOOLS_IMAGE_PLACEHOLDER
    restart: always
    logging: *logging
    mem_limit: 512m
    cpus: 0.5
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    env_file: /etc/fhr.env
    environment: RUNTIME_ENV_PLACEHOLDER
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Студенческая платформа здесь больше не живёт: с 04.10.2026 она на своей
  # машине fhr-students (students_vm.tf) — шаг 3 переезда. Агент COI при
  # обновлении состава удаляет контейнеры сервисов, которых нет в файле
  # (как --remove-orphans), поэтому копия и её крон уходят отсюда сразу,
  # без пересоздания машины и без двойных напоминаний.

  # Агент метрик и логов (память и диск машины -> Monitoring, логи -> Cloud
  # Logging). Подробности — agent.tf. Лёгкий: потолок памяти 256 МБ.
  ua:
    image: UA_IMAGE_PLACEHOLDER
    restart: always
    logging: *logging
    uts: host
    mem_limit: 256m
    cpus: 0.5
    environment:
      UA_CONFIG: UA_CONFIG_PLACEHOLDER
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        mkdir -p /etc/yandex/unified_agent
        printf '%s' "$$UA_CONFIG" > /etc/yandex/unified_agent/config.yml
        exec /usr/bin/unified_agent --config /etc/yandex/unified_agent/config.yml
    volumes:
      - /proc:/ua_proc:ro
      - /var/lib/docker/containers:/docker_logs:ro
      - ua_data:/var/lib/yandex/unified_agent

volumes:
  ua_data:
  caddy_data:
  caddy_config:
